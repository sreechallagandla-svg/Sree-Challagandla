<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact List</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", sans-serif;
      color: #192536;
      background: #f3f6fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
    }

    main { width: min(900px, 100%); margin: 0 auto; }

    header { margin-bottom: 28px; }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 2.7rem);
      letter-spacing: -0.04em;
    }

    header p { margin: 0; color: #687589; }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(25 37 54 / 5%);
    }

    h2 { margin: 0 0 20px; font-size: 1.15rem; }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #455267;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #d7dfeb;
      border-radius: 9px;
      color: inherit;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgb(59 130 246 / 18%);
      border-color: #3b82f6;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    button.secondary {
      border: 1px solid #d7dfeb;
      background: #fff;
      color: #334155;
    }

    button.secondary:hover { background: #f8fafc; }

    .form-actions { margin-top: 20px; }

    .contacts-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .contacts-heading h2 { margin: 0; }

    #contact-count {
      color: #687589;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .search-form input { min-width: 0; }
    .search-form button { flex: 0 0 auto; }

    #message {
      min-height: 1.3em;
      margin: 0 0 12px;
      color: #526176;
      font-size: 0.9rem;
    }

    #contact-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .contact-card {
      padding: 15px;
      border: 1px solid #e6ebf2;
      border-radius: 11px;
      overflow-wrap: anywhere;
    }

    .contact-card h3 { margin: 0 0 9px; font-size: 1rem; }
    .contact-card p { margin: 5px 0 0; color: #687589; font-size: 0.9rem; }
    .empty-state { padding: 20px 4px; color: #8490a1; text-align: center; }

    @media (max-width: 680px) {
      body { padding: 30px 16px; }
      .layout { grid-template-columns: 1fr; }
      .panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Contact List</h1>
      <p>Add contacts, browse your list, or find someone by name.</p>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a contact</h2>
        <form id="add-form">
          <label for="name">Name</label>
          <input id="name" name="name" maxlength="99" autocomplete="name" required>

          <label for="phone">Phone number</label>
          <input id="phone" name="phone" maxlength="19" autocomplete="tel" required>

          <label for="email">Email</label>
          <input id="email" name="email" maxlength="99" autocomplete="email" required>

          <div class="form-actions">
            <button type="submit">Add contact</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="contacts-heading">
        <div class="contacts-heading">
          <h2 id="contacts-heading">Your contacts</h2>
          <span id="contact-count">0 / 100</span>
        </div>

        <form class="search-form" id="search-form" role="search">
          <label for="search-name" hidden>Search by exact name</label>
          <input id="search-name" name="search" placeholder="Search by exact name" autocomplete="off">
          <button type="submit">Search</button>
          <button class="secondary" id="show-all" type="button">Show all</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <ul id="contact-list" aria-label="Contact list"></ul>
      </section>
    </div>
  </main>

  <script>
    const maxContacts = 100;
    const contacts = [];
    const contactList = document.querySelector("#contact-list");
    const contactCount = document.querySelector("#contact-count");
    const message = document.querySelector("#message");
    const searchInput = document.querySelector("#search-name");

    function renderContacts(list = contacts) {
      contactList.replaceChildren();
      contactCount.textContent = `${contacts.length} / ${maxContacts}`;

      if (list.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = contacts.length === 0
          ? "No contacts yet. Add one to get started."
          : "No matching contact found.";
        contactList.append(empty);
        return;
      }

      for (const contact of list) {
        const item = document.createElement("li");
        item.className = "contact-card";

        const name = document.createElement("h3");
        name.textContent = contact.name;
        item.append(name);

        for (const [label, value] of [["Phone", contact.phone], ["Email", contact.email]]) {
          const detail = document.createElement("p");
          detail.textContent = `${label}: ${value}`;
          item.append(detail);
        }

        contactList.append(item);
      }
    }

    document.querySelector("#add-form").addEventListener("submit", (event) => {
      event.preventDefault();
      if (contacts.length >= maxContacts) {
        message.textContent = "Contact list is full (100 contacts maximum).";
        return;
      }

      const formData = new FormData(event.currentTarget);
      contacts.push({
        name: formData.get("name").trim(),
        phone: formData.get("phone").trim(),
        email: formData.get("email").trim()
      });
      event.currentTarget.reset();
      message.textContent = "Contact added successfully.";
      renderContacts();
    });

    document.querySelector("#search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = searchInput.value.trim();

      if (contacts.length === 0) {
        message.textContent = "No contacts available to search.";
        renderContacts([]);
        return;
      }

      const match = contacts.find((contact) => contact.name === name);
      message.textContent = match
        ? "Contact found."
        : `No contact found with the name "${name}".`;
      renderContacts(match ? [match] : []);
    });

    document.querySelector("#show-all").addEventListener("click", () => {
      searchInput.value = "";
      message.textContent = "";
      renderContacts();
    });

    renderContacts();
  </script>
</body>
</html>
